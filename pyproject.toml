[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hollali"
version = "1.0.0"
description = "A modular, offline-capable voice assistant with CLI and desktop GUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0,<2.0",
    "SpeechRecognition>=3.10.0,<4.0",
    "pyttsx3>=2.90,<3.0",
    "pyjokes>=0.8.0,<1.0",
    "wikipedia>=1.4.0,<2.0",
    "wolframalpha>=5.0.0,<6.0",
    "twilio>=9.0.0,<10.0",
    "requests>=2.31.0,<3.0",
    "google-api-python-client>=2.0.0,<3.0",
    "google-auth-oauthlib>=1.0.0,<2.0",
    "google-auth>=2.0.0,<3.0",
    "vosk>=0.3.45,<0.4",
    "sounddevice>=0.5.0,<1.0",
    "pydub>=0.25.1,<1.0",
    "numpy>=1.26.0,<2.0",
    "PySide6>=6.6.0,<7.0",
    "pyaudio>=0.2.14,<0.3",
]

[project.scripts]
hollali = "main:main"
hollali-desktop = "desktop:main"

[tool.setuptools]
py-modules = [
    "main", "desktop", "config", "speech", "commands", "llm",
    "database", "log", "utils", "system_control", "plugin_loader", "constants",
]

[tool.setuptools.packages.find]
include = ["plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
